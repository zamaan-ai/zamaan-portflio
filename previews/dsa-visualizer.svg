<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650">
  <defs>
    <linearGradient id="dsa-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1220"/>
      <stop offset="100%" stop-color="#0f1f33"/>
    </linearGradient>
    <linearGradient id="bar-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
    <linearGradient id="pivot-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="sort-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
  </defs>
  <rect width="900" height="650" fill="url(#dsa-bg)"/>
  <g font-family="'Onest', -apple-system, sans-serif" fill="#e6e9ee">
    <text x="60" y="68" font-size="20" font-weight="600" letter-spacing="4" fill="#38bdf8">DSA VISUALIZER</text>
    <text x="60" y="102" font-size="13" font-weight="400" fill="#94a7b8" letter-spacing="1.5">REAL-TIME ALGORITHM SIMULATOR &amp; DATA STRUCTURE INSPECTOR</text>

    <!-- Main visualizer canvas card -->
    <rect x="52" y="140" width="796" height="450" rx="14" fill="#0d1b2a" stroke="#253e5e" stroke-width="1.5"/>
    
    <!-- Top toolbar inside card -->
    <rect x="52" y="140" width="796" height="52" rx="14" fill="#13273e"/>
    <circle cx="82" cy="166" r="6" fill="#ef4444"/>
    <circle cx="102" cy="166" r="6" fill="#f59e0b"/>
    <circle cx="122" cy="166" r="6" fill="#10b981"/>
    
    <text x="156" y="171" font-size="13" font-weight="500" fill="#e2e8f0">QuickSort — Partition Stage [L: 0, R: 18, Pivot: 42]</text>
    <rect x="640" y="152" width="90" height="28" rx="6" fill="#1e3a5f" stroke="#38bdf8" stroke-width="1"/>
    <text x="685" y="171" font-size="12" font-weight="600" fill="#38bdf8" text-anchor="middle">Step Play ▶</text>
    <rect x="742" y="152" width="90" height="28" rx="6" fill="#1e3a5f"/>
    <text x="787" y="171" font-size="12" fill="#94a3b8" text-anchor="middle">Speed: 1.5x</text>

    <!-- Bars visualization -->
    <!-- Sorted left slice -->
    <rect x="80" y="440" width="28" height="80" rx="4" fill="url(#sort-grad)"/>
    <rect x="116" y="410" width="28" height="110" rx="4" fill="url(#sort-grad)"/>
    <rect x="152" y="370" width="28" height="150" rx="4" fill="url(#sort-grad)"/>
    <rect x="188" y="340" width="28" height="180" rx="4" fill="url(#sort-grad)"/>

    <!-- Active partition / comparing -->
    <rect x="224" y="280" width="28" height="240" rx="4" fill="url(#bar-grad)"/>
    <rect x="260" y="230" width="28" height="290" rx="4" fill="url(#bar-grad)"/>
    <rect x="296" y="310" width="28" height="210" rx="4" fill="#ec4899"/>
    <rect x="332" y="200" width="28" height="320" rx="4" fill="#ec4899"/>
    
    <!-- Pivot element -->
    <rect x="368" y="260" width="28" height="260" rx="4" fill="url(#pivot-grad)" stroke="#fef08a" stroke-width="2"/>
    <text x="382" y="245" font-size="11" font-weight="700" fill="#fef08a" text-anchor="middle">PIVOT</text>
    
    <!-- Unsorted right slice -->
    <rect x="404" y="350" width="28" height="170" rx="4" fill="url(#bar-grad)"/>
    <rect x="440" y="220" width="28" height="300" rx="4" fill="url(#bar-grad)"/>
    <rect x="476" y="390" width="28" height="130" rx="4" fill="url(#bar-grad)"/>
    <rect x="512" y="270" width="28" height="250" rx="4" fill="url(#bar-grad)"/>
    <rect x="548" y="330" width="28" height="190" rx="4" fill="url(#bar-grad)"/>
    <rect x="584" y="420" width="28" height="100" rx="4" fill="url(#bar-grad)"/>
    <rect x="620" y="250" width="28" height="270" rx="4" fill="url(#bar-grad)"/>

    <!-- Right info panel -->
    <rect x="668" y="220" width="164" height="300" rx="8" fill="#13273e" stroke="#253e5e"/>
    <text x="686" y="252" font-size="12" font-weight="600" fill="#94a3b8" letter-spacing="1">TIME COMPLEXITY</text>
    <text x="686" y="282" font-size="20" font-weight="700" fill="#38bdf8">O(N log N)</text>
    
    <text x="686" y="325" font-size="12" font-weight="600" fill="#94a3b8" letter-spacing="1">SPACE</text>
    <text x="686" y="352" font-size="18" font-weight="600" fill="#e2e8f0">O(log N)</text>
    
    <text x="686" y="395" font-size="12" font-weight="600" fill="#94a3b8" letter-spacing="1">ARRAY SIZE</text>
    <text x="686" y="422" font-size="18" font-weight="600" fill="#e2e8f0">32 Items</text>

    <text x="686" y="465" font-size="12" font-weight="600" fill="#94a3b8" letter-spacing="1">COMPARISONS</text>
    <text x="686" y="492" font-size="18" font-weight="600" fill="#10b981">142 Steps</text>

    <!-- Bottom baseline -->
    <line x1="70" y1="520" x2="658" y2="520" stroke="#334155" stroke-width="2"/>
    <text x="80" y="555" font-size="13" fill="#64748b">React.js · HTML5/CSS3 · Interactive State Trees · Step Execution Control</text>
  </g>
</svg>
