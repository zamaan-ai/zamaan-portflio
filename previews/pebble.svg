<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650"><rect width="900" height="650" fill="#151211"/><g font-family="Arial,sans-serif" fill="#e6e9ee"><text x="62" y="66" font-size="18" letter-spacing="3">PEBBLE</text><text x="62" y="102" font-size="13" fill="#94a7b8">FROM A LINE OF CODE TO A VISIBLE CHAIN OF THOUGHT.</text><rect x="52" y="147" width="796" height="436" rx="12" fill="#211d1c" stroke="#645045"/><path d="M495 148V583" stroke="#645045"/><g font-family="monospace" font-size="22"><text x="80" y="209" fill="#dcad87">fn fibonacci(n) {</text><text x="100" y="253">if n &lt; 2 { return n }</text><text x="100" y="297">return fibonacci(n-1)</text><text x="130" y="337">+ fibonacci(n-2)</text><text x="80" y="381" fill="#dcad87">}</text><text x="80" y="469">fibonacci(8)</text><text x="80" y="522" fill="#b4cca3">→ 21</text></g><rect x="540" y="193" width="258" height="56" rx="7" fill="#382a25" stroke="#92634c"/><text x="561" y="227" font-size="17">SOURCE</text><rect x="540" y="281" width="258" height="56" rx="7" fill="#382a25" stroke="#92634c"/><text x="561" y="315" font-size="17">TOKENS</text><rect x="540" y="369" width="258" height="56" rx="7" fill="#382a25" stroke="#92634c"/><text x="561" y="403" font-size="17">SYNTAX TREE</text><rect x="540" y="457" width="258" height="56" rx="7" fill="#382a25" stroke="#92634c"/><text x="561" y="491" font-size="17">INTERPRETER</text></g></svg>