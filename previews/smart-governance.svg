<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650">
  <defs>
    <linearGradient id="gov-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06181b"/>
      <stop offset="100%" stop-color="#0b292c"/>
    </linearGradient>
    <linearGradient id="teal-accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>
  <rect width="900" height="650" fill="url(#gov-bg)"/>
  <g font-family="'Onest', -apple-system, sans-serif" fill="#e6e9ee">
    <text x="60" y="68" font-size="20" font-weight="600" letter-spacing="4" fill="#2dd4bf">SMART GOVERNANCE AI &amp; IOT</text>
    <text x="60" y="102" font-size="13" font-weight="400" fill="#7ba5a8" letter-spacing="1.5">MUNICIPAL TELEMETRY PIPELINE &amp; AUTOMATED ISSUE TRIAGE</text>

    <!-- Main board container -->
    <rect x="52" y="140" width="796" height="450" rx="14" fill="#092023" stroke="#164e52" stroke-width="1.5"/>
    
    <!-- Top toolbar inside card -->
    <rect x="52" y="140" width="796" height="52" rx="14" fill="#0d2e33"/>
    <circle cx="82" cy="166" r="6" fill="#ef4444"/>
    <circle cx="102" cy="166" r="6" fill="#f59e0b"/>
    <circle cx="122" cy="166" r="6" fill="#10b981"/>
    
    <text x="156" y="171" font-size="13" font-weight="500" fill="#ccfbf1">Telemetry Stream: Sector 7 North • 1,240 pkts/sec • Live Analysis Active</text>
    <rect x="710" y="152" width="120" height="28" rx="6" fill="#115e59"/>
    <text x="770" y="171" font-size="12" font-weight="600" fill="#5eead4" text-anchor="middle">ONLINE: Zone A-G</text>

    <!-- Pipeline architecture cards -->
    <!-- Step 1: IoT Sensors -->
    <rect x="80" y="220" width="160" height="200" rx="10" fill="#113438" stroke="#1f5f65" stroke-width="1.2"/>
    <circle cx="115" cy="255" r="16" fill="#134e4a"/>
    <text x="115" y="260" font-size="14" fill="#5eead4" text-anchor="middle">📡</text>
    <text x="142" y="260" font-size="14" font-weight="600" fill="#e2e8f0">IoT Sensors</text>
    <text x="96" y="295" font-size="11" fill="#99f6e4">Telemetry Nodes</text>
    <text x="96" y="318" font-size="11" fill="#7ba5a8">Pressure / Flow / Air</text>
    <text x="96" y="341" font-size="11" fill="#7ba5a8">Battery 98% Normal</text>
    <rect x="96" y="365" width="128" height="24" rx="4" fill="#0d9488"/>
    <text x="160" y="381" font-size="11" font-weight="600" fill="#f0fdfa" text-anchor="middle">Edge Aggregated</text>

    <!-- Arrow 1 -->
    <line x1="240" y1="320" x2="278" y2="320" stroke="#2dd4bf" stroke-width="2.5" stroke-dasharray="4 4"/>
    <polygon points="278,315 288,320 278,325" fill="#2dd4bf"/>

    <!-- Step 2: Express & Node.js Ingestion -->
    <rect x="290" y="220" width="160" height="200" rx="10" fill="#113438" stroke="#1f5f65" stroke-width="1.2"/>
    <circle cx="325" cy="255" r="16" fill="#134e4a"/>
    <text x="325" y="260" font-size="14" fill="#5eead4" text-anchor="middle">⚡</text>
    <text x="352" y="260" font-size="14" font-weight="600" fill="#e2e8f0">Ingestion API</text>
    <text x="306" y="295" font-size="11" fill="#99f6e4">Node.js + Express</text>
    <text x="306" y="318" font-size="11" fill="#7ba5a8">WebSocket Telemetry</text>
    <text x="306" y="341" font-size="11" fill="#7ba5a8">Validation &amp; Schema</text>
    <rect x="306" y="365" width="128" height="24" rx="4" fill="#0d9488"/>
    <text x="370" y="381" font-size="11" font-weight="600" fill="#f0fdfa" text-anchor="middle">Sub-50ms Latency</text>

    <!-- Arrow 2 -->
    <line x1="450" y1="320" x2="488" y2="320" stroke="#2dd4bf" stroke-width="2.5" stroke-dasharray="4 4"/>
    <polygon points="488,315 498,320 488,325" fill="#2dd4bf"/>

    <!-- Step 3: AI Triage & Analytics -->
    <rect x="500" y="220" width="160" height="200" rx="10" fill="#113438" stroke="#1f5f65" stroke-width="1.2"/>
    <circle cx="535" cy="255" r="16" fill="#134e4a"/>
    <text x="535" y="260" font-size="14" fill="#5eead4" text-anchor="middle">🧠</text>
    <text x="562" y="260" font-size="14" font-weight="600" fill="#e2e8f0">AI Reasoning</text>
    <text x="516" y="295" font-size="11" fill="#99f6e4">Anomaly Detection</text>
    <text x="516" y="318" font-size="11" fill="#7ba5a8">Severity Prediction</text>
    <text x="516" y="341" font-size="11" fill="#7ba5a8">Auto Incident Ticket</text>
    <rect x="516" y="365" width="128" height="24" rx="4" fill="#0d9488"/>
    <text x="580" y="381" font-size="11" font-weight="600" fill="#f0fdfa" text-anchor="middle">98.4% Confidence</text>

    <!-- Arrow 3 -->
    <line x1="660" y1="320" x2="698" y2="320" stroke="#2dd4bf" stroke-width="2.5" stroke-dasharray="4 4"/>
    <polygon points="698,315 708,320 698,325" fill="#2dd4bf"/>

    <!-- Step 4: Governance Dashboard -->
    <rect x="710" y="220" width="120" height="200" rx="10" fill="#113438" stroke="#1f5f65" stroke-width="1.2"/>
    <circle cx="738" cy="255" r="16" fill="#134e4a"/>
    <text x="738" y="260" font-size="14" fill="#5eead4" text-anchor="middle">🏛</text>
    <text x="764" y="260" font-size="14" font-weight="600" fill="#e2e8f0">Triage</text>
    <text x="724" y="295" font-size="11" fill="#99f6e4">Department</text>
    <text x="724" y="318" font-size="11" fill="#7ba5a8">Auto Alert</text>
    <text x="724" y="341" font-size="11" fill="#7ba5a8">Audit Log</text>
    <rect x="722" y="365" width="96" height="24" rx="4" fill="#059669"/>
    <text x="770" y="381" font-size="11" font-weight="600" fill="#f0fdfa" text-anchor="middle">Dispatched</text>

    <!-- Bottom summary banner -->
    <rect x="80" y="445" width="750" height="65" rx="8" fill="#0c2528" stroke="#1b4d52"/>
    <text x="100" y="475" font-size="14" font-weight="600" fill="#5eead4">Civic Impact: 35% Faster Response Times Across Municipal Sectors</text>
    <text x="100" y="497" font-size="12" fill="#7ba5a8">Express.js · Node.js · IoT Edge Aggregation · Automated Telemetry Alerting · Cloud Infrastructure</text>
  </g>
</svg>
